name: Frontend Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  Lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: "./frontend/.nvmrc"

      - name: Install dependencies
        run: bun ci
        working-directory: ./frontend

      - name: Run lint
        run: bun run lint
        working-directory: ./frontend

  Build:
    runs-on: ubuntu-latest
    needs: [Lint]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: "./frontend/.nvmrc"

      - name: Install dependencies
        run: bun ci
        working-directory: ./frontend

      - name: Build frontend
        run: bun run build
        working-directory: ./frontend

  CI:
    name: Frontend / CI
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [Lint, Build]

    steps:
      - name: Validate frontend jobs
        run: |
          if [[ "${{ needs.Lint.result }}" != "success" || "${{ needs.Build.result }}" != "success" ]]; then
            echo "Frontend CI failed: lint/build did not complete successfully"
            exit 1
          fi
