name: Frontend Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend.yml'

  Lint:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: "./frontend/.nvmrc"

      - name: Install dependencies
        run: bun ci
        working-directory: ./frontend

      - name: Run lint
        run: bun run lint
        working-directory: ./frontend

  Build:
    runs-on: ubuntu-latest
    needs: [changes, Lint]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: "./frontend/.nvmrc"

      - name: Install dependencies
        run: bun ci
        working-directory: ./frontend

      - name: Build frontend
        run: bun run build
        working-directory: ./frontend

  CI:
    name: Frontend / CI
    runs-on: ubuntu-latest
    needs: [changes, Lint, Build]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Validate frontend jobs
        run: |
          if [[ "${{ needs.Lint.result }}" != "success" || "${{ needs.Build.result }}" != "success" ]]; then
            echo "Frontend CI failed: lint/build did not complete successfully"
            exit 1
          fi
