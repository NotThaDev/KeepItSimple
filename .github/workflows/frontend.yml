name: Frontend Build

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: "./frontend/.nvmrc"

      - name: Install dependencies
        run: bun ci
        working-directory: ./frontend

      - name: Run lint
        run: bun run lint
        working-directory: ./frontend

  build:
    runs-on: ubuntu-latest
    depends-on: [lint]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: "./frontend/.nvmrc"

      - name: Install dependencies
        run: bun ci
        working-directory: ./frontend

      - name: Build frontend
        run: bun run build
        working-directory: ./frontend
