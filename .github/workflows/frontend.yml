name: Frontend Build

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: "./frontend/.nvmrc"
          cache: "bun"

      - name: Install dependencies
        run: bun ci
        working-directory: ./frontend

      - name: Lint code
        run: bun run lint
        working-directory: ./frontend

      - name: Build frontend
        run: bun run build
        working-directory: ./frontend
