name: Backend Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend.yml'

  Format:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore KeepItSimple.sln

      - name: Run Format
        run: dotnet format --verify-no-changes

  Build:
    runs-on: ubuntu-latest
    needs: [changes, Format]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore KeepItSimple.sln

      - name: Build backend
        run: dotnet build KeepItSimple.sln --configuration Release --no-restore

  CI:
    name: Backend / CI
    runs-on: ubuntu-latest
    if: needs.changes.outputs.backend == 'true'
    needs: [changes, Format, Build]
    steps:
      - name: Validate backend jobs
        run: |
          if [[ "${{ needs.Format.result }}" != "success" || "${{ needs.Build.result }}" != "success" ]]; then
            echo "Backend CI failed: format/build did not complete successfully"
            exit 1
          fi
